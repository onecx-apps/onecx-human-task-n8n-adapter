app:
  name: n8n-adapter
  image:
    repository: "onecx/onecx-human-task-n8n-adapter"
  operator:
    keycloak:
      client:
        enabled: true
        spec:
          kcConfig:
            defaultClientScopes: [ ocx-ev:all, ocx-ai:all, ocx-ht:write, ocx-mail:read, ocx-mail:write, ocx-tk:write ]
    microservice:
      spec:
        description: "OneCX Human Task n8n adapter"
        name: "onecx-human-task-n8n-adapter"
